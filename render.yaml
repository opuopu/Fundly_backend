services:
  # Web API Service
  - type: web
    name: fundly-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: fundly-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: fundly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: Fundly

databases:
  # Managed PostgreSQL Database
  - name: fundly-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
